name: Daily Digest

on:
  schedule:
    - cron:  '0 0 * * *'
  workflow_dispatch:
    inputs:
      date:
        description: 'Date (YYYY-MM-DD)'
        required: true

jobs:
  generate-digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Generate daily digest
        run: |
          # Script to generate daily digest based on config.yml and the given date
          # This might involve using the date input to generate the digest for that specific date
          echo "Generating daily digest for ${{ github.event.inputs.date || (date +'%Y-%m-%d') }}"

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add .
          git commit -m "📊 AI CLI 工具社区动态日报 ${{ github.event.inputs.date || (date +'%Y-%m-%d') }}" || echo "No changes to commit"
          git push origin main